<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.8">
  <title>Степаша</title>
  <style>
    body {
      background: #000;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 10px;
    }
    .box {
      padding: 20px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      color: #eee;
    }
    .gif {
      width: 180px;
      height: 180px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .phrase {
      font-size: 1.5rem;
      font-weight: bold;
      margin: 8px 0 12px;
      background: #111;
      padding: 8px;
    }
    .game-select {
      display: flex;
      gap: 4px;
      justify-content: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .game-select button {
      background: #222;
      color: #ccc;
      border: 1px solid #444;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .game-select button.active {
      background: #444;
      color: #fff;
      border-color: #888;
    }
    .settings-row {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
      font-size: 0.75rem;
    }
    .settings-row select {
      background: #222;
      color: #ccc;
      border: 1px solid #444;
      padding: 3px 6px;
      font-size: 0.75rem;
    }
    .settings-row label {
      color: #aaa;
    }
    .btns {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .btns button {
      width: 65px;
      height: 65px;
      border: none;
      background: none;
      cursor: pointer;
      padding: 5px;
    }
    .btns button img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .tictactoe {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 3px;
      margin-bottom: 10px;
    }
    .tictactoe button {
      aspect-ratio: 1;
      background: #111;
      border: 1px solid #333;
      color: #fff;
      font-size: 1.8rem;
      cursor: pointer;
    }
    .checkers-board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 0;
      margin-bottom: 10px;
      border: 2px solid #555;
    }
    .checkers-board button {
      aspect-ratio: 1;
      cursor: pointer;
      border: none;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.2rem;
      position: relative;
    }
    .white-cell { background: #fff; }
    .black-cell { background: #222; }
    .selected { box-shadow: inset 0 0 0 3px #ffeb3b; }
    .capture-hint { box-shadow: inset 0 0 0 3px #00ff00; }
    .piece-img {
      width: 90%;
      height: 90%;
      object-fit: contain;
    }
    .timer-bar {
      width: 100%;
      height: 4px;
      background: #333;
      margin-bottom: 6px;
    }
    .timer-fill {
      height: 100%;
      background: #ffeb3b;
      transition: width 0.1s linear;
    }
    .chat {
      background: #111;
      padding: 10px;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }
    .reset {
      background: #222;
      color: #ccc;
      border: 1px solid #444;
      padding: 6px 18px;
      cursor: pointer;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="box">
    <img class="gif" id="gif" src="https://theblueprint.ru/upload/10286m/vms/eab27402cc3bb03d766824c3b6cdbd90.gif" alt="Степаша">
    <div class="phrase" id="phrase">бурмалда</div>

    <div class="game-select">
      <button id="gameRps" class="active">камень ножницы</button>
      <button id="gameTtt">крестики нолики</button>
      <button id="gameCheckers">шашки</button>
    </div>

    <div class="settings-row" id="checkersSettings" style="display:none;">
      <label>сложность:</label>
      <select id="difficultySelect">
        <option value="easy">легко</option>
        <option value="medium" selected>средне</option>
        <option value="hard">сложно</option>
      </select>
      <label>цвет:</label>
      <select id="colorSelect">
        <option value="white">белые</option>
        <option value="black">чёрные</option>
      </select>
    </div>

    <div id="rpsArea">
      <div class="btns">
        <button id="rock"><img src="https://img.magnific.com/premium-photo/natural-gray-rock-isolated-white_53876-1429553.jpg?semt=ais_test_b&w=740&q=80" alt="камень"></button>
        <button id="scissors"><img src="https://pngicon.ru/file/uploads/nozhnicy.png" alt="ножницы"></button>
        <button id="paper"><img src="https://bakerstore.ru/image/cache/catalog/PH/3876221-600x600.png" alt="бумага"></button>
      </div>
    </div>

    <div id="tttArea" style="display:none;">
      <div class="tictactoe" id="board"></div>
    </div>

    <div id="checkersArea" style="display:none;">
      <div class="timer-bar" id="timerBar" style="display:none;">
        <div class="timer-fill" id="timerFill" style="width:100%;"></div>
      </div>
      <div class="checkers-board" id="checkersBoard"></div>
    </div>

    <div class="chat">
      <div id="botSay">Степаша: жду</div>
      <div id="result">сделай выбор</div>
    </div>
    <button class="reset" id="reset">заново</button>
  </div>

  <script>
    const gif = document.getElementById('gif');
    const phrase = document.getElementById('phrase');
    const botSay = document.getElementById('botSay');
    const result = document.getElementById('result');
    const resetBtn = document.getElementById('reset');

    const gameRps = document.getElementById('gameRps');
    const gameTtt = document.getElementById('gameTtt');
    const gameCheckers = document.getElementById('gameCheckers');
    const rpsArea = document.getElementById('rpsArea');
    const tttArea = document.getElementById('tttArea');
    const checkersArea = document.getElementById('checkersArea');
    const checkersSettings = document.getElementById('checkersSettings');
    const difficultySelect = document.getElementById('difficultySelect');
    const colorSelect = document.getElementById('colorSelect');
    const board = document.getElementById('board');
    const checkersBoard = document.getElementById('checkersBoard');
    const timerBar = document.getElementById('timerBar');
    const timerFill = document.getElementById('timerFill');

    let currentGame = 'rps';
    let tttBoard = ['','','','','','','','',''];
    let tttActive = true;
    let tttMistakeChance = 0.15;

    let checkersPos = null;
    let checkersSelected = null;
    let checkersTurn = 'white';
    let playerColor = 'white';
    let botColor = 'black';
    let checkersGameOver = false;
    let chainCaptures = [];
    let chainTimer = null;
    let difficulty = 'medium';

    const WHITE_PIECE_IMG = 'https://avatanplus.com/files/resources/original/5f394193cd6b2173f7a82981.png';

    function updateColors() {
      playerColor = colorSelect.value;
      botColor = playerColor === 'white' ? 'black' : 'white';
    }

    // ========== КРЕСТИКИ-НОЛИКИ ==========
    function tttMinimax(b, isMax) {
      const winner = checkTttWin(b);
      if (winner === 'X') return -10;
      if (winner === 'O') return 10;
      if (!b.includes('')) return 0;
      if (isMax) {
        let best = -999;
        for (let i=0; i<9; i++) {
          if (b[i] === '') { b[i] = 'O'; best = Math.max(best, tttMinimax(b, false)); b[i] = ''; }
        }
        return best;
      } else {
        let best = 999;
        for (let i=0; i<9; i++) {
          if (b[i] === '') { b[i] = 'X'; best = Math.min(best, tttMinimax(b, true)); b[i] = ''; }
        }
        return best;
      }
    }

    function findBestTttMove() {
      let bestScore = -999;
      let bestMove = -1;
      const emptyCells = [];
      for (let i=0; i<9; i++) {
        if (tttBoard[i] === '') {
          emptyCells.push(i);
          tttBoard[i] = 'O';
          const score = tttMinimax(tttBoard, false);
          tttBoard[i] = '';
          if (score > bestScore) { bestScore = score; bestMove = i; }
        }
      }
      if (Math.random() < tttMistakeChance && emptyCells.length > 1) {
        const badMoves = emptyCells.filter(i => i !== bestMove);
        if (badMoves.length > 0) return badMoves[Math.floor(Math.random() * badMoves.length)];
      }
      return bestMove;
    }

    function checkTttWin(b) {
      const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      for (const [a,b_,c] of wins) if (b[a] && b[a]===b[b_] && b[a]===b[c]) return b[a];
      return b.includes('') ? null : 'ничья';
    }

    function renderTtt() {
      board.innerHTML = '';
      tttBoard.forEach((cell, i) => {
        const btn = document.createElement('button');
        btn.textContent = cell;
        btn.onclick = () => tttPlayerMove(i);
        board.appendChild(btn);
      });
    }

    function tttPlayerMove(i) {
      if (!tttActive || tttBoard[i] !== '') return;
      tttBoard[i] = 'X';
      renderTtt();
      const winner = checkTttWin(tttBoard);
      if (winner) {
        tttActive = false;
        if (winner==='X') { result.textContent='ты победил'; phrase.textContent='повезло...'; botSay.textContent='Степаша: ...'; }
        else { result.textContent='ничья'; phrase.textContent='ничья'; botSay.textContent='Степаша: ничья'; }
        return;
      }
      if (!tttBoard.includes('')) {
        tttActive = false;
        result.textContent='ничья'; phrase.textContent='ничья'; botSay.textContent='Степаша: ничья';
        return;
      }
      setTimeout(() => {
        if (!tttActive) return;
        const botMove = findBestTttMove();
        if (botMove >= 0) {
          tttBoard[botMove] = 'O';
          renderTtt();
          botSay.textContent = 'Степаша: я сходил';
          const w = checkTttWin(tttBoard);
          if (w) {
            tttActive = false;
            if (w==='O') { result.textContent='Степаша победил'; phrase.textContent='бурмалда!'; }
            else { result.textContent='ничья'; phrase.textContent='ничья'; }
          } else if (!tttBoard.includes('')) {
            tttActive = false;
            result.textContent='ничья'; phrase.textContent='ничья';
          }
        }
      }, 300);
    }

    // ========== ШАШКИ ==========
    function createCheckersPosition() {
      const pos = [];
      for (let r=0; r<8; r++) {
        pos[r] = [];
        for (let c=0; c<8; c++) {
          if ((r+c)%2 === 1) {
            if (r<3) pos[r][c] = 'b';
            else if (r>4) pos[r][c] = 'w';
            else pos[r][c] = '';
          } else pos[r][c] = '';
        }
      }
      return pos;
    }

    function cloneCheckers(pos) { return pos.map(row => [...row]); }

    function getCapturesOnly(pos, row, col) {
      const piece = pos[row][col];
      if (!piece) return [];
      const isWhite = piece === 'w' || piece === 'W';
      const isKing = piece === 'W' || piece === 'B';
      const captures = [];
      if (isKing) {
        [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([dr,dc]) => {
          for (let i=1; i<8; i++) {
            const r=row+dr*i, c=col+dc*i;
            if (r<0||r>=8||c<0||c>=8) break;
            if (pos[r][c]) {
              const tw = pos[r][c]==='w'||pos[r][c]==='W';
              if (isWhite !== tw) {
                const r2=r+dr, c2=c+dc;
                if (r2>=0&&r2<8&&c2>=0&&c2<8&&!pos[r2][c2]) captures.push({row:r2,col:c2,captures:[{row:r,col:c}]});
              }
              break;
            }
          }
        });
      } else {
        [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([dr,dc]) => {
          const r1=row+dr, c1=col+dc;
          if (r1>=0&&r1<8&&c1>=0&&c1<8&&pos[r1][c1]) {
            const tw = pos[r1][c1]==='w'||pos[r1][c1]==='W';
            if (isWhite !== tw) {
              const r2=r1+dr, c2=c1+dc;
              if (r2>=0&&r2<8&&c2>=0&&c2<8&&!pos[r2][c2]) captures.push({row:r2,col:c2,captures:[{row:r1,col:c1}]});
            }
          }
        });
      }
      return captures;
    }

    function getCheckersMoves(pos, row, col) {
      const piece = pos[row][col];
      if (!piece) return [];
      const isWhite = piece === 'w' || piece === 'W';
      const isKing = piece === 'W' || piece === 'B';
      const captures = getCapturesOnly(pos, row, col);
      if (captures.length > 0) return captures;
      const moves = [];
      if (isKing) {
        [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([dr,dc]) => {
          for (let i=1; i<8; i++) {
            const r=row+dr*i, c=col+dc*i;
            if (r<0||r>=8||c<0||c>=8) break;
            if (!pos[r][c]) moves.push({row:r,col:c,captures:[]});
            else break;
          }
        });
      } else {
        const forward = isWhite ? -1 : 1;
        [[forward,-1],[forward,1]].forEach(([dr,dc]) => {
          const r=row+dr, c=col+dc;
          if (r>=0&&r<8&&c>=0&&c<8&&!pos[r][c]) moves.push({row:r,col:c,captures:[]});
        });
      }
      return moves;
    }

    function getAllCheckersMoves(pos, isWhite) {
      const allMoves = [];
      let hasCaptures = false;
      for (let r=0; r<8; r++) {
        for (let c=0; c<8; c++) {
          const piece = pos[r][c];
          if (!piece) continue;
          if ((piece==='w'||piece==='W') !== isWhite) continue;
          const moves = getCheckersMoves(pos, r, c);
          moves.forEach(m => {
            if (m.captures && m.captures.length>0) { hasCaptures = true; allMoves.push({fromRow:r,fromCol:c,toRow:m.row,toCol:m.col,captures:m.captures}); }
          });
        }
      }
      if (hasCaptures) return allMoves;
      for (let r=0; r<8; r++) {
        for (let c=0; c<8; c++) {
          const piece = pos[r][c];
          if (!piece) continue;
          if ((piece==='w'||piece==='W') !== isWhite) continue;
          const moves = getCheckersMoves(pos, r, c);
          moves.forEach(m => {
            if (!m.captures || m.captures.length===0) allMoves.push({fromRow:r,fromCol:c,toRow:m.row,toCol:m.col,captures:[]});
          });
        }
      }
      return allMoves;
    }

    function makeCheckersMove(pos, move) {
      const newPos = cloneCheckers(pos);
      const piece = newPos[move.fromRow][move.fromCol];
      newPos[move.toRow][move.toCol] = piece;
      newPos[move.fromRow][move.fromCol] = '';
      move.captures.forEach(cap => { newPos[cap.row][cap.col] = ''; });
      if (piece==='w' && move.toRow===0) newPos[move.toRow][move.toCol] = 'W';
      if (piece==='b' && move.toRow===7) newPos[move.toRow][move.toCol] = 'B';
      return newPos;
    }

    function hasMoreCaptures(pos, row, col) { return getCapturesOnly(pos, row, col).length > 0; }

    function evaluateCheckers(pos) {
      let score = 0;
      for (let r=0; r<8; r++) for (let c=0; c<8; c++) {
        const p = pos[r][c];
        if (p==='w') score += 10;
        if (p==='W') score += 30;
        if (p==='b') score -= 10;
        if (p==='B') score -= 30;
      }
      return score;
    }

    function minimaxCheckers(pos, depth, isMaximizing, alpha, beta) {
      if (depth === 0) return evaluateCheckers(pos);
      const moves = getAllCheckersMoves(pos, isMaximizing);
      if (moves.length === 0) return isMaximizing ? -9999 : 9999;
      if (isMaximizing) {
        let best = -99999;
        for (const move of moves) {
          const np = makeCheckersMove(pos, move);
          best = Math.max(best, minimaxCheckers(np, depth-1, false, alpha, beta));
          alpha = Math.max(alpha, best);
          if (beta <= alpha) break;
        }
        return best;
      } else {
        let best = 99999;
        for (const move of moves) {
          const np = makeCheckersMove(pos, move);
          best = Math.min(best, minimaxCheckers(np, depth-1, true, alpha, beta));
          beta = Math.min(beta, best);
          if (beta <= alpha) break;
        }
        return best;
      }
    }

    function findBestCheckersMove(pos) {
      const botIsWhite = botColor === 'white';
      const moves = getAllCheckersMoves(pos, botIsWhite);
      if (moves.length === 0) return null;
      
      let depth;
      if (difficulty === 'easy') depth = 1;
      else if (difficulty === 'medium') depth = 3;
      else depth = 5;
      
      let bestMove = moves[0];
      let bestScore = botIsWhite ? -99999 : 99999;
      
      for (const move of moves) {
        const np = makeCheckersMove(pos, move);
        const score = minimaxCheckers(np, depth-1, !botIsWhite, -99999, 99999);
        if (botIsWhite) {
          if (score > bestScore) { bestScore = score; bestMove = move; }
        } else {
          if (score < bestScore) { bestScore = score; bestMove = move; }
        }
      }
      
      if (difficulty === 'easy' && Math.random() < 0.3 && moves.length > 1) {
        return moves[Math.floor(Math.random() * moves.length)];
      }
      
      return bestMove;
    }

    function botMove() {
      if (checkersGameOver) return;
      const botMoveResult = findBestCheckersMove(checkersPos);
      if (botMoveResult) {
        checkersPos = makeCheckersMove(checkersPos, botMoveResult);
        botSay.textContent = 'Степаша: я сходил';
      }
      checkersTurn = playerColor;
      renderCheckersBoard();
      
      const playerIsWhite = playerColor === 'white';
      const playerMoves = getAllCheckersMoves(checkersPos, playerIsWhite);
      if (playerMoves.length === 0) {
        checkersGameOver = true;
        result.textContent = 'Степаша победил';
        phrase.textContent = 'бурмалда!';
      }
    }

    function startChainTimer() {
      clearTimeout(chainTimer);
      chainTimer = setTimeout(() => {
        timerBar.style.display = 'none';
        finishChain();
      }, 4000);
      timerBar.style.display = 'block';
      timerFill.style.width = '100%';
      setTimeout(() => { if (timerBar.style.display !== 'none') timerFill.style.width = '0%'; }, 100);
    }

    function finishChain() {
      clearTimeout(chainTimer);
      timerBar.style.display = 'none';
      chainCaptures = [];
      checkersTurn = playerColor === 'white' ? 'black' : 'white';
      renderCheckersBoard();
      if (checkersTurn !== playerColor) {
        setTimeout(botMove, 200);
      }
    }

    function renderCheckersBoard() {
      checkersBoard.innerHTML = '';
      for (let r=0; r<8; r++) {
        for (let c=0; c<8; c++) {
          const btn = document.createElement('button');
          btn.className = (r+c)%2 === 0 ? 'white-cell' : 'black-cell';
          const piece = checkersPos[r][c];
          btn.innerHTML = '';
          if (piece) {
            const img = document.createElement('img');
            img.src = WHITE_PIECE_IMG;
            img.className = 'piece-img';
            if (piece === 'w' || piece === 'W') {
              img.style.filter = 'none';
              btn.appendChild(img);
              if (piece === 'W') {
                const l = document.createElement('span');
                l.textContent = 'Д'; l.style.position='absolute'; l.style.fontSize='0.7rem'; l.style.color='#000'; l.style.fontWeight='bold'; l.style.pointerEvents='none';
                btn.appendChild(l);
              }
            } else {
              img.style.filter = 'invert(1)';
              btn.appendChild(img);
              if (piece === 'B') {
                const l = document.createElement('span');
                l.textContent = 'Д'; l.style.position='absolute'; l.style.fontSize='0.7rem'; l.style.color='#fff'; l.style.fontWeight='bold'; l.style.pointerEvents='none';
                btn.appendChild(l);
              }
            }
          }
          if (chainCaptures.length > 0) {
            const lp = chainCaptures[chainCaptures.length-1];
            if (getCapturesOnly(checkersPos, lp.row, lp.col).find(m => m.row===r && m.col===c)) btn.classList.add('capture-hint');
          }
          if (checkersSelected && checkersSelected.row===r && checkersSelected.col===c) btn.classList.add('selected');
          btn.onclick = () => checkersClick(r, c);
          checkersBoard.appendChild(btn);
        }
      }
    }

    function checkersClick(row, col) {
      if (checkersGameOver || checkersTurn !== playerColor) return;
      const isPlayerWhite = playerColor === 'white';
      
      if (chainCaptures.length > 0) {
        const lp = chainCaptures[chainCaptures.length-1];
        const captures = getCapturesOnly(checkersPos, lp.row, lp.col);
        const valid = captures.find(m => m.row===row && m.col===col);
        if (valid) {
          checkersPos = makeCheckersMove(checkersPos, {fromRow:lp.row, fromCol:lp.col, toRow:row, toCol:col, captures:valid.captures||[]});
          chainCaptures.push({row, col});
          if (hasMoreCaptures(checkersPos, row, col)) {
            clearTimeout(chainTimer);
            startChainTimer();
            checkersSelected = null;
            renderCheckersBoard();
          } else {
            clearTimeout(chainTimer);
            timerBar.style.display = 'none';
            chainCaptures = [];
            checkersTurn = botColor;
            checkersSelected = null;
            renderCheckersBoard();
            if (checkersTurn !== playerColor) setTimeout(botMove, 200);
          }
        }
        return;
      }
      
      if (checkersSelected) {
        const piece = checkersPos[checkersSelected.row][checkersSelected.col];
        if (piece && (piece==='w'||piece==='W') === isPlayerWhite) {
          const moves = getCheckersMoves(checkersPos, checkersSelected.row, checkersSelected.col);
          const valid = moves.find(m => m.row===row && m.col===col);
          if (valid) {
            checkersPos = makeCheckersMove(checkersPos, {fromRow:checkersSelected.row, fromCol:checkersSelected.col, toRow:row, toCol:col, captures:valid.captures||[]});
            if (valid.captures && valid.captures.length>0 && hasMoreCaptures(checkersPos, row, col)) {
              chainCaptures = [{row, col}];
              startChainTimer();
              checkersSelected = null;
              renderCheckersBoard();
              return;
            }
            checkersSelected = null;
            checkersTurn = botColor;
            renderCheckersBoard();
            if (checkersTurn !== playerColor) setTimeout(botMove, 200);
            return;
          }
        }
        checkersSelected = null;
      }
      
      const piece = checkersPos[row][col];
      if (piece && (piece==='w'||piece==='W') === isPlayerWhite) checkersSelected = {row, col};
      renderCheckersBoard();
    }

    function switchGame(game) {
      currentGame = game;
      gameRps.classList.toggle('active', game==='rps');
      gameTtt.classList.toggle('active', game==='ttt');
      gameCheckers.classList.toggle('active', game==='checkers');
      rpsArea.style.display = game==='rps' ? 'block' : 'none';
      tttArea.style.display = game==='ttt' ? 'block' : 'none';
      checkersArea.style.display = game==='checkers' ? 'block' : 'none';
      checkersSettings.style.display = game==='checkers' ? 'flex' : 'none';
      clearTimeout(chainTimer);
      timerBar.style.display = 'none';
      resetAll();
    }

    gameRps.onclick = () => switchGame('rps');
    gameTtt.onclick = () => switchGame('ttt');
    gameCheckers.onclick = () => switchGame('checkers');
    difficultySelect.onchange = () => { difficulty = difficultySelect.value; resetAll(); };
    colorSelect.onchange = () => { updateColors(); resetAll(); };

    function playRps(player) {
      const moves = ['камень','ножницы','бумага'];
      const bot = moves[Math.floor(Math.random()*3)];
      botSay.textContent = 'Степаша: я выбрал ' + bot;
      if (player === bot) { result.textContent = 'ничья'; phrase.textContent = 'ничья'; }
      else if ((player==='камень'&&bot==='ножницы')||(player==='ножницы'&&bot==='бумага')||(player==='бумага'&&bot==='камень')) { result.textContent = 'ты победил'; phrase.textContent = 'повезло...'; }
      else { result.textContent = 'Степаша победил'; phrase.textContent = 'бурмалда!'; }
    }

    gif.onclick = () => { phrase.textContent = 'бурмалда'; };
    document.getElementById('rock').onclick = () => playRps('камень');
    document.getElementById('scissors').onclick = () => playRps('ножницы');
    document.getElementById('paper').onclick = () => playRps('бумага');

    function resetAll() {
      clearTimeout(chainTimer);
      timerBar.style.display = 'none';
      chainCaptures = [];
      updateColors();
      if (currentGame === 'rps') {
        botSay.textContent = 'Степаша: жду'; result.textContent = 'сделай выбор'; phrase.textContent = 'бурмалда';
      } else if (currentGame === 'ttt') {
        tttBoard = ['','','','','','','','',''];
        tttActive = true;
        renderTtt();
        botSay.textContent = 'Степаша: твой ход'; result.textContent = 'крестики нолики'; phrase.textContent = 'бурмалда';
      } else if (currentGame === 'checkers') {
        difficulty = difficultySelect.value;
        checkersPos = createCheckersPosition();
        checkersSelected = null;
        checkersTurn = 'white';
        checkersGameOver = false;
        renderCheckersBoard();
        if (playerColor === 'white') {
          botSay.textContent = 'Степаша: твой ход (белые)';
        } else {
          botSay.textContent = 'Степаша: я хожу (белые)';
          setTimeout(botMove, 500);
        }
        result.textContent = 'шашки'; phrase.textContent = 'бурмалда';
      }
    }

    resetBtn.onclick = resetAll;
    updateColors();
    renderTtt();
    checkersPos = createCheckersPosition();
    renderCheckersBoard();
  </script>
</body>
</html>
