  <title>УБЕЙ ГЛАВНУЮ МРАЗЬ ФОРТПОРТА</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: white;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      touch-action: manipulation;
      user-select: none;
    }
    .game-area {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .cockroach {
      position: absolute;
      width: 140px;
      height: auto;
      cursor: pointer;
      z-index: 10;
      animation: wiggle 0.5s infinite alternate ease-in-out;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.3));
      transition: left 0.2s ease, top 0.2s ease;
    }
    .cockroach:active {
      transform: scale(0.85);
    }
    @keyframes wiggle {
      0% { transform: translateY(0px) rotate(-1deg); }
      100% { transform: translateY(-3px) rotate(2deg); }
    }
    .splat {
      position: absolute;
      width: 200px;
      height: auto;
      pointer-events: none;
      z-index: 20;
      animation: splatFade 0.7s ease-out forwards;
      filter: drop-shadow(0 0 10px rgba(180,0,0,0.6));
    }
    @keyframes splatFade {
      0% { 
        opacity: 1; 
        transform: scale(0.6) rotate(0deg); 
      }
      35% { 
        opacity: 1; 
        transform: scale(1.4) rotate(6deg); 
      }
      100% { 
        opacity: 0; 
        transform: scale(1.6) rotate(14deg); 
      }
    }
  </style>
</head>

    const SPLAT_IMG = "https://www.animatedscience.co.uk/wp-content/uploads/2019/12/image4.png";
    const SOUND_URL = "https://androiddevhub.com/play.php?token=e302b76d4c9b43b0";

    const gameArea = document.getElementById('gameArea');
    let cockroachEl = document.getElementById('cockroach');
    
    let audio = null;
    let soundEnabled = true;

    // Подготовка звука
    function prepareAudio() {
      try {
        audio = new Audio(SOUND_URL);
        audio.preload = 'auto';
        audio.volume = 0.75;
        audio.addEventListener('error', () => {
          soundEnabled = false;
          audio = null;
        });
        audio.load();
      } catch (e) {
        soundEnabled = false;
        audio = null;
      }
    }

    function playSquashSound() {
      if (!soundEnabled || !audio) return;
      try {
        audio.currentTime = 0;
        const promise = audio.play();
        if (promise !== undefined) {
          promise.catch(() => {});
        }
      } catch (e) {}
    }

    // Генерация случайной позиции для таракана (чтобы не вылезал за края)
    function getRandomPosition() {
      const areaWidth = gameArea.clientWidth;
      const areaHeight = gameArea.clientHeight;
      
      // Примерные размеры таракана (ширина 140px, высота примерно 100px)
      const roachWidth = 140;
      const roachHeight = 100;
      
      // Безопасные отступы от краёв, чтобы таракан не обрезался
      const maxLeft = areaWidth - roachWidth;
      const maxTop = areaHeight - roachHeight;
      
      const randomLeft = Math.max(0, Math.floor(Math.random() * maxLeft));
      const randomTop = Math.max(0, Math.floor(Math.random() * maxTop));
      
      return { left: randomLeft, top: randomTop };
    }

    // Переместить таракана в случайное место
    function moveCockroachToRandom() {
      if (!cockroachEl) return;
      const pos = getRandomPosition();
      cockroachEl.style.left = pos.left + 'px';
      cockroachEl.style.top = pos.top + 'px';
    }

    // Создать брызги в точке клика
    function createSplat(clientX, clientY) {
      const splat = document.createElement('img');
      splat.src = SPLAT_IMG;
      splat.className = 'splat';
      splat.alt = 'брызги';
      
      const areaRect = gameArea.getBoundingClientRect();
      const relX = clientX - areaRect.left;
      const relY = clientY - areaRect.top;
      
      splat.style.position = 'absolute';
      splat.style.left = (relX - 100) + 'px';  // половина ширины брызг (200/2)
      splat.style.top = (relY - 100) + 'px';
      
      gameArea.appendChild(splat);
      
      splat.addEventListener('animationend', () => {
        if (splat.parentNode) {
          splat.remove();
        }
      });
    }

    // Обработчик клика по таракану
    function onCockroachClick(event) {
      event.stopPropagation();
      
      const clientX = event.clientX;
      const clientY = event.clientY;
      
      playSquashSound();
      
      createSplat(clientX, clientY);
      
      if (cockroachEl) {
        cockroachEl.style.display = 'none';
      }
      
      setTimeout(() => {
        if (cockroachEl) {
          
          moveCockroachToRandom();
          // Потом показываем
          cockroachEl.style.display = 'block';
          
          cockroachEl.style.animation = 'none';
          void cockroachEl.offsetWidth;
          cockroachEl.style.animation = 'wiggle 0.5s infinite alternate ease-in-out';
        }
      }, 350);
    }

    function initGame() {
      if (!cockroachEl) {
        cockroachEl = document.createElement('img');
        cockroachEl.id = 'cockroach';
        cockroachEl.className = 'cockroach';
        cockroachEl.src = COCKROACH_IMG;
        cockroachEl.setAttribute('crossorigin', 'anonymous');
        gameArea.appendChild(cockroachEl);
      } else {
        cockroachEl.src = COCKROACH_IMG;
      }
      
      moveCockroachToRandom();
      
      cockroachEl.removeEventListener('click', onCockroachClick);
      cockroachEl.addEventListener('click', onCockroachClick);
      
      cockroachEl.addEventListener('error', () => {});
    }

    window.addEventListener('resize', () => {
      if (cockroachEl && cockroachEl.style.display !== 'none') {
        moveCockroachToRandom();
      }
    });

    prepareAudio();
    initGame();
  })();
</script>
