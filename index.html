<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Plants vs Zombies — Дневная Лужайка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #1a3e1f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            padding: 0;
        }

        .game-container {
            width: min(100vw, calc(100vh * 1.6));
            height: min(100vh, calc(100vw / 1.6));
            position: relative;
            display: flex;
            flex-direction: column;
            background: #5b8c4e;
            margin: auto;
            border: 4px solid #2d1a0c;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        .top-bar {
            position: relative;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            height: 82px;
            padding: 0;
            background:
                linear-gradient(
                    rgba(100, 35, 10, 0.18),
                    rgba(55, 20, 5, 0.25)
                ),
                #8b3f16;
            border: 3px solid #321506;
            border-bottom: 4px solid #281005;
            box-shadow:
                inset 0 2px 0 rgba(255,255,255,0.12),
                inset 0 -4px 8px rgba(0,0,0,0.35),
                0 2px 4px rgba(0,0,0,0.5);
            flex-shrink: 0;
            z-index: 100;
        }

        .top-bar::before {
            content: "";
            position: absolute;
            inset: 3px;
            pointer-events: none;
            background:
                repeating-linear-gradient(
                    8deg,
                    transparent 0px,
                    transparent 12px,
                    rgba(45, 12, 2, 0.12) 13px,
                    transparent 15px
                );
            opacity: 0.7;
        }

        .sun-meter {
            position: relative;
            width: 74px;
            height: 82px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-left: 5px;
            z-index: 2;
        }

        .sun-orb {
            position: relative;
            width: 58px;
            height: 58px;
            margin-top: -3px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background:
                radial-gradient(
                    circle at 50% 45%,
                    #fffde7 0%,
                    #fff700 18%,
                    #ffd000 40%,
                    #e86b00 65%,
                    #672000 100%
                );
            border: 3px solid #3b1605;
            box-shadow:
                inset 0 0 7px rgba(255,255,255,0.8),
                0 2px 4px rgba(0,0,0,0.7);
        }

        .sun-orb::before {
            content: "";
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            border: 2px solid #bd7434;
            box-shadow:
                inset 0 0 5px #000,
                0 0 3px #000;
        }

        .sun-orb img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            filter:
                drop-shadow(0 1px 1px #6b2c00)
                drop-shadow(0 0 3px #fff000);
        }

        .sun-count-wrapper {
            position: absolute;
            top: 61px;
            left: 8px;
            width: 55px;
            height: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5ead2;
            border: 2px solid #4b2814;
            border-radius: 4px;
            box-shadow:
                inset 0 1px 2px rgba(255,255,255,0.8),
                0 1px 2px rgba(0,0,0,0.7);
        }

        .sun-count-wrapper span {
            font-family: Arial, sans-serif;
            font-size: 17px;
            font-weight: 900;
            color: #25160c;
            text-shadow: 0 1px #fff;
        }

        .seed-bank {
            display: flex;
            gap: 3px;
            margin-left: 2px;
            height: 76px;
            z-index: 2;
        }

        .seed {
            position: relative;
            width: 50px;
            height: 68px;
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            cursor: pointer;
            background:
                linear-gradient(
                    135deg,
                    #e9e0b5 0%,
                    #cfc28b 50%,
                    #a99a65 100%
                );
            border: 2px solid #301a0c;
            border-radius: 3px;
            box-shadow:
                inset 1px 1px 0 rgba(255,255,255,0.65),
                inset -1px -1px 0 rgba(0,0,0,0.35),
                0 2px 2px rgba(0,0,0,0.5);
            transition:
                transform 0.12s,
                filter 0.12s;
        }

        .seed:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .seed.selected {
            border: 3px solid #fff200;
            box-shadow:
                0 0 7px #fff200,
                inset 1px 1px 0 rgba(255,255,255,0.8);
            transform: translateY(-2px);
        }

        .seed.disabled {
            opacity: 0.48;
            filter: grayscale(0.8);
            pointer-events: none;
        }

        .seed-image {
            width: 46px;
            height: 51px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .seed img {
            width: 43px;
            height: 43px;
            object-fit: contain;
            display: block;
        }

        .seed .cost {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 17px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eee4c3;
            border-top: 1px solid #6b542d;
            font-size: 12px;
            line-height: 12px;
            font-weight: 900;
            color: #21150b;
            text-shadow: 0 1px #fff;
        }

        .lawn-container {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow: hidden;
        }

        .lawn {
            display: grid;
            grid-template-rows: repeat(5, 1fr);
            gap: 0;
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1400px;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 0;
            position: relative;
            min-height: 0;
        }

        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            min-height: 0;
            transition: all 0.15s;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            aspect-ratio: 1;
        }

        .cell:hover {
            filter: brightness(1.2);
            z-index: 1;
        }

        .cell.occupied {
            cursor: not-allowed;
            filter: none;
        }

        .plant {
            width: 80%;
            height: 80%;
            object-fit: contain;
            position: absolute;
            z-index: 5;
            pointer-events: none;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
            transition: filter 0.1s;
        }

        .plant.flash-white {
            filter: brightness(2) drop-shadow(0 2px 2px rgba(0,0,0,0.2));
        }

        .plant.sun-flash {
            filter: brightness(1.8) drop-shadow(0 2px 2px rgba(0,0,0,0.2));
            transition: filter 0.1s;
        }

        .zombie {
            position: absolute;
            width: 80%;
            height: 80%;
            object-fit: contain;
            z-index: 7;
            pointer-events: none;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
            transition: none;
        }

        .zombie.flash-white {
            filter: brightness(2) drop-shadow(0 2px 2px rgba(0,0,0,0.3));
        }

        .projectile {
            position: absolute;
            width: 28px;
            height: 28px;
            object-fit: contain;
            z-index: 6;
            pointer-events: none;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
            transition: none;
        }

        .mower {
            position: absolute;
            width: 65px;
            height: 55px;
            object-fit: contain;
            z-index: 9;
            pointer-events: none;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
            left: -35px;
            bottom: 5px;
            transition: none;
        }

        .sun {
            position: absolute;
            width: 40px;
            height: 40px;
            z-index: 12;
            cursor: pointer;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
            pointer-events: auto;
            transition: transform 0.15s;
        }

        .sun:hover {
            transform: scale(1.15);
        }

        .ghost-plant {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            opacity: 0.4;
            width: 55px;
            height: 55px;
            object-fit: contain;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
            transform: translate(-50%, -50%);
        }

        @media (max-height: 700px) {
            .top-bar {
                height: 60px;
            }
            .sun-meter {
                width: 60px;
                height: 60px;
            }
            .sun-orb {
                width: 44px;
                height: 44px;
            }
            .sun-orb img {
                width: 36px;
                height: 36px;
            }
            .sun-count-wrapper {
                top: 46px;
                left: 4px;
                width: 44px;
                height: 18px;
            }
            .sun-count-wrapper span {
                font-size: 14px;
            }
            .seed {
                width: 42px;
                height: 56px;
                margin-top: 2px;
            }
            .seed img {
                width: 34px;
                height: 34px;
            }
            .seed .cost {
                height: 14px;
                font-size: 10px;
            }
            .seed-image {
                height: 40px;
            }
        }

        @media (max-width: 500px) {
            .top-bar {
                height: 60px;
            }
            .sun-meter {
                width: 55px;
                height: 60px;
                margin-left: 2px;
            }
            .sun-orb {
                width: 40px;
                height: 40px;
                margin-top: -2px;
            }
            .sun-orb img {
                width: 32px;
                height: 32px;
            }
            .sun-count-wrapper {
                top: 42px;
                left: 2px;
                width: 40px;
                height: 16px;
            }
            .sun-count-wrapper span {
                font-size: 12px;
            }
            .seed {
                width: 36px;
                height: 50px;
                margin-top: 2px;
            }
            .seed img {
                width: 28px;
                height: 28px;
            }
            .seed .cost {
                height: 13px;
                font-size: 9px;
            }
            .seed-image {
                height: 34px;
            }
            .seed-bank {
                gap: 2px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="top-bar">
            <div class="sun-meter">
                <div class="sun-orb">
                    <img src="https://cdn-icons-png.flaticon.com/512/2720/2720081.png" alt="Солнце">
                </div>
                <div class="sun-count-wrapper">
                    <span id="sunCount">150</span>
                </div>
            </div>

            <div class="seed-bank">
                <div class="seed" id="seedSunflower" title="Подсолнух - 50 солнца">
                    <div class="seed-image">
                        <img src="https://fortport.ru/photo/55463" alt="Подсолнух">
                    </div>
                    <span class="cost">50</span>
                </div>

                <div class="seed" id="seedPeashooter" title="Горохострел - 100 солнца">
                    <div class="seed-image">
                        <img src="https://fortport.ru/photo/55462" alt="Горохострел">
                    </div>
                    <span class="cost">100</span>
                </div>
            </div>
        </div>

        <div class="lawn-container">
            <div class="lawn" id="lawn"></div>
        </div>
    </div>

    <img class="ghost-plant" id="ghostPlant" style="display: none;" alt="">

    <script>
        const IMAGES = {
            sunflower: 'https://fortport.ru/photo/55463',
            peashooter: 'https://fortport.ru/photo/55462',
            zombie: 'https://fortport.ru/photo/4059',
            projectile: 'https://foni.papik.pro/uploads/posts/2024-09/foni-papik-pro-7vtu-p-kartinki-krug-zelenii-na-prozrachnom-fone-13.png',
            mower: 'https://static.wikia.nocookie.net/plantsvs-zombies/images/1/18/Machine.png/revision/latest/scale-to-width-down/250?cb=20200506143358&path-prefix=ru',
            sun: 'https://cdn-icons-png.flaticon.com/512/2720/2720081.png',
            grass1: 'https://fortport.ru/photo/51017',
            grass2: 'https://fortport.ru/photo/51016'
        };

        const AUDIO_FILES = {
            background: 'plants_vs_zombies_04 - Grasswalk.mp3',
            sunPickup: 'plants-vs-zombies-sun-pickup.mp3',
            seedPacket: 'plants-vs-zombies-seed-packet-sound.mp3',
            planting: 'plants-vs-zombies-planting-sound.mp3',
            hit: 'plants-vs-zombies-hit.mp3',
            chomp: 'chomp.mp3',
            chomp2: 'chomp2.mp3'
        };

        class AudioManager {
            constructor() {
                this.sounds = {};
                this.backgroundMusic = null;
                this.initAudio();
            }

            initAudio() {
                for (const [key, file] of Object.entries(AUDIO_FILES)) {
                    const audio = new Audio(file);
                    audio.preload = 'auto';
                    this.sounds[key] = audio;
                }

                this.backgroundMusic = this.sounds.background;
                this.backgroundMusic.loop = true;
                this.backgroundMusic.volume = 0.3;
            }

            playBackground() {
                this.backgroundMusic.play().catch(() => {
                    document.addEventListener('click', () => {
                        this.backgroundMusic.play();
                    }, { once: true });
                });
            }

            playSound(soundKey) {
                const sound = this.sounds[soundKey];
                if (sound) {
                    sound.currentTime = 0;
                    sound.play().catch(() => {});
                }
            }

            playChomp() {
                const sounds = [this.sounds.chomp, this.sounds.chomp2];
                const randomSound = sounds[Math.floor(Math.random() * sounds.length)];
                if (randomSound) {
                    randomSound.currentTime = 0;
                    randomSound.play().catch(() => {});
                }
            }
        }

        class Game {
            constructor() {
                this.sunCount = 150;
                this.selectedPlant = null;
                this.gameRunning = true;
                this.rows = 5;
                this.cols = 9;
                this.plants = [];
                this.zombies = [];
                this.projectiles = [];
                this.mowers = [];
                this.suns = [];
                this.intervals = [];
                this.timeouts = [];
                this.zombieCounter = 0;
                this.waveNumber = 1;
                this.audioManager = new AudioManager();
                this.ghostPlant = document.getElementById('ghostPlant');
                this.cellWidth = 0;
                this.cellHeight = 0;
                this.gameStartTime = Date.now();

                this.init();
            }

            init() {
                this.createLawn();
                this.createMowers();
                this.bindEvents();
                this.startGame();
                this.audioManager.playBackground();
            }

            createLawn() {
                const lawn = document.getElementById('lawn');
                lawn.innerHTML = '';

                for (let r = 0; r < this.rows; r++) {
                    this.plants[r] = [];
                    const row = document.createElement('div');
                    row.className = 'row';
                    row.dataset.row = r;

                    for (let c = 0; c < this.cols; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.row = r;
                        cell.dataset.col = c;
                        
                        if ((r + c) % 2 === 0) {
                            cell.style.backgroundImage = `url('${IMAGES.grass1}')`;
                        } else {
                            cell.style.backgroundImage = `url('${IMAGES.grass2}')`;
                        }
                        
                        cell.addEventListener('click', (e) => this.onCellClick(e));
                        row.appendChild(cell);
                        this.plants[r][c] = null;
                    }

                    lawn.appendChild(row);
                }

                setTimeout(() => {
                    const firstCell = document.querySelector('.cell');
                    this.cellWidth = firstCell.getBoundingClientRect().width;
                    this.cellHeight = firstCell.getBoundingClientRect().height;
                }, 100);
            }

            createMowers() {
                this.mowers = [];
                const rows = document.querySelectorAll('.row');
                rows.forEach((row, index) => {
                    const mower = document.createElement('img');
                    mower.src = IMAGES.mower;
                    mower.className = 'mower';
                    mower.style.left = '-35px';
                    row.appendChild(mower);
                    this.mowers.push({
                        row: index,
                        element: mower,
                        active: false,
                        x: -35
                    });
                });
            }

            bindEvents() {
                document.getElementById('seedSunflower').addEventListener('click', () => {
                    this.audioManager.playSound('seedPacket');
                    this.togglePlantSelection('sunflower');
                });

                document.getElementById('seedPeashooter').addEventListener('click', () => {
                    this.audioManager.playSound('seedPacket');
                    this.togglePlantSelection('peashooter');
                });

                document.addEventListener('mousemove', (e) => {
                    if (this.selectedPlant && this.gameRunning) {
                        this.ghostPlant.style.display = 'block';
                        this.ghostPlant.style.left = e.clientX + 'px';
                        this.ghostPlant.style.top = e.clientY + 'px';
                    } else {
                        this.ghostPlant.style.display = 'none';
                    }
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        this.selectedPlant = null;
                        this.updateSeedButtons();
                        this.ghostPlant.style.display = 'none';
                    }
                });
            }

            togglePlantSelection(type) {
                if (!this.gameRunning) return;
                
                const cost = type === 'sunflower' ? 50 : 100;
                if (this.sunCount < cost) return;

                if (this.selectedPlant === type) {
                    this.selectedPlant = null;
                    this.ghostPlant.style.display = 'none';
                } else {
                    this.selectedPlant = type;
                    this.ghostPlant.src = type === 'sunflower' ? IMAGES.sunflower : IMAGES.peashooter;
                }
                this.updateSeedButtons();
            }

            updateSeedButtons() {
                const sunSeed = document.getElementById('seedSunflower');
                const peaSeed = document.getElementById('seedPeashooter');

                sunSeed.classList.toggle('selected', this.selectedPlant === 'sunflower');
                peaSeed.classList.toggle('selected', this.selectedPlant === 'peashooter');
                sunSeed.classList.toggle('disabled', this.sunCount < 50);
                peaSeed.classList.toggle('disabled', this.sunCount < 100);
            }

            onCellClick(e) {
                if (!this.gameRunning || !this.selectedPlant) return;

                const row = parseInt(e.target.dataset.row);
                const col = parseInt(e.target.dataset.col);

                if (this.plants[row][col]) return;

                const cost = this.selectedPlant === 'sunflower' ? 50 : 100;
                if (this.sunCount < cost) return;

                this.sunCount -= cost;
                this.updateSunDisplay();
                this.audioManager.playSound('planting');
                this.plantOnCell(row, col, this.selectedPlant);
                this.selectedPlant = null;
                this.ghostPlant.style.display = 'none';
                this.updateSeedButtons();
            }

            plantOnCell(row, col, type) {
                const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
                const plant = document.createElement('img');
                plant.src = type === 'sunflower' ? IMAGES.sunflower : IMAGES.peashooter;
                plant.className = 'plant';
                cell.appendChild(plant);
                cell.classList.add('occupied');
                
                const plantData = {
                    type: type,
                    element: plant,
                    lastShot: 0,
                    lastSun: Date.now(),
                    hp: 100,
                    firstSunDelay: type === 'sunflower' ? 5000 + Math.random() * 2000 : 0,
                    firstSunDone: false
                };
                
                this.plants[row][col] = plantData;
            }

            updateSunDisplay() {
                document.getElementById('sunCount').textContent = this.sunCount;
                this.updateSeedButtons();
            }

            flashElement(element, className, duration = 300) {
                if (!element) return;
                element.classList.add(className);
                setTimeout(() => {
                    element.classList.remove(className);
                }, duration);
            }

            spawnSun() {
                if (!this.gameRunning) return;

                const row = Math.floor(Math.random() * this.rows);
                const col = Math.floor(Math.random() * (this.cols - 1));
                const sun = document.createElement('img');
                sun.src = IMAGES.sun;
                sun.className = 'sun';
                const rowElement = document.querySelector(`.row[data-row="${row}"]`);
                const cellWidth = this.cellWidth;
                
                const sunX = col * cellWidth + cellWidth / 2 - 20;
                sun.style.left = `${sunX}px`;
                sun.style.top = '-50px';
                
                sun.style.cursor = 'pointer';
                sun.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.collectSun(sun);
                });
                
                rowElement.appendChild(sun);
                this.suns.push(sun);

                let y = -50;
                const fallInterval = setInterval(() => {
                    if (!this.gameRunning) {
                        clearInterval(fallInterval);
                        return;
                    }
                    y += 3;
                    sun.style.top = `${y}px`;
                    
                    if (y >= row * this.cellHeight + this.cellHeight / 2 - 20) {
                        clearInterval(fallInterval);
                        
                        setTimeout(() => {
                            if (sun.parentNode) {
                                sun.remove();
                                const index = this.suns.indexOf(sun);
                                if (index > -1) {
                                    this.suns.splice(index, 1);
                                }
                            }
                        }, 10000);
                    }
                }, 30);
                this.intervals.push(fallInterval);
            }

            spawnSunFromPlant(row, col) {
                if (!this.gameRunning) return;

                const plantData = this.plants[row][col];
                if (plantData && plantData.element) {
                    this.flashElement(plantData.element, 'sun-flash', 3000);
                }

                const sun = document.createElement('img');
                sun.src = IMAGES.sun;
                sun.className = 'sun';
                const rowElement = document.querySelector(`.row[data-row="${row}"]`);
                const cellWidth = this.cellWidth;
                
                const sunX = col * cellWidth + cellWidth / 2 - 20;
                const sunY = row * this.cellHeight + this.cellHeight / 2 - 20;
                sun.style.left = `${sunX}px`;
                sun.style.top = `${sunY}px`;
                
                sun.style.cursor = 'pointer';
                sun.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.collectSun(sun);
                });
                
                rowElement.appendChild(sun);
                this.suns.push(sun);
                
                setTimeout(() => {
                    if (sun.parentNode) {
                        sun.remove();
                        const index = this.suns.indexOf(sun);
                        if (index > -1) {
                            this.suns.splice(index, 1);
                        }
                    }
                }, 10000);
            }

            collectSun(sunElement) {
                if (!this.gameRunning || !sunElement.parentNode) return;

                this.sunCount += 25;
                this.updateSunDisplay();
                this.audioManager.playSound('sunPickup');
                sunElement.remove();
                
                const index = this.suns.indexOf(sunElement);
                if (index > -1) {
                    this.suns.splice(index, 1);
                }
            }

            spawnZombie() {
                if (!this.gameRunning) return;

                this.zombieCounter++;
                const row = Math.floor(Math.random() * this.rows);
                const zombie = document.createElement('img');
                zombie.src = IMAGES.zombie;
                zombie.className = 'zombie';
                
                const rowElement = document.querySelector(`.row[data-row="${row}"]`);
                const rowWidth = rowElement.getBoundingClientRect().width;
                
                zombie.style.left = `${rowWidth + 10}px`;
                zombie.style.top = `${this.cellHeight / 2 - (this.cellHeight * 0.8 / 2)}px`;

                rowElement.appendChild(zombie);

                const zombieObj = {
                    id: Date.now() + Math.random(),
                    row: row,
                    x: rowWidth + 10,
                    hp: 200,
                    element: zombie,
                    alive: true,
                    speed: 0.7,
                    eating: false,
                    damageInterval: null,
                    eatingPlantCol: -1
                };

                this.zombies.push(zombieObj);
                this.moveZombie(zombieObj);
            }

            moveZombie(zombie) {
                if (!zombie.alive || !this.gameRunning) return;

                const interval = setInterval(() => {
                    if (!zombie.alive || !this.gameRunning) {
                        clearInterval(interval);
                        return;
                    }

                    let hasPlant = false;
                    const objectSize = this.cellWidth * 0.8;
                    const offset = (this.cellWidth - objectSize) / 2;
                    
                    for (let c = 0; c < this.cols; c++) {
                        if (this.plants[zombie.row][c]) {
                            const plantX = c * this.cellWidth + offset;
                            const zombieX = zombie.x + offset;
                            
                            // Проверка пересечения хитбоксов
                            if (zombieX + objectSize > plantX && zombieX < plantX + objectSize) {
                                hasPlant = true;
                                if (!zombie.eating) {
                                    zombie.eating = true;
                                    zombie.eatingPlantCol = c;
                                    this.startEating(zombie, c);
                                }
                                break;
                            }
                        }
                    }

                    if (!hasPlant) {
                        if (zombie.eating) {
                            zombie.eating = false;
                            zombie.eatingPlantCol = -1;
                            if (zombie.damageInterval) {
                                clearInterval(zombie.damageInterval);
                            }
                        }
                        zombie.x -= zombie.speed;
                        zombie.element.style.left = `${zombie.x}px`;
                    }

                    if (zombie.x < 10) {
                        this.activateMower(zombie.row);
                        zombie.alive = false;
                        zombie.element.remove();
                        const index = this.zombies.indexOf(zombie);
                        if (index > -1) {
                            this.zombies.splice(index, 1);
                        }
                        clearInterval(interval);
                    }
                }, 50);
                this.intervals.push(interval);
            }

            startEating(zombie, plantCol) {
                if (zombie.damageInterval) {
                    clearInterval(zombie.damageInterval);
                }
                
                zombie.damageInterval = setInterval(() => {
                    if (!zombie.alive || !this.gameRunning) {
                        clearInterval(zombie.damageInterval);
                        return;
                    }
                    
                    if (this.plants[zombie.row][plantCol]) {
                        this.audioManager.playChomp();
                        
                        const plant = this.plants[zombie.row][plantCol];
                        plant.hp -= 25;
                        
                        this.flashElement(plant.element, 'flash-white', 300);
                        
                        if (plant.hp <= 0) {
                            plant.element.remove();
                            this.plants[zombie.row][plantCol] = null;
                            document.querySelector(`.cell[data-row="${zombie.row}"][data-col="${plantCol}"]`).classList.remove('occupied');
                            zombie.eating = false;
                            zombie.eatingPlantCol = -1;
                            clearInterval(zombie.damageInterval);
                        }
                    } else {
                        zombie.eating = false;
                        zombie.eatingPlantCol = -1;
                        clearInterval(zombie.damageInterval);
                    }
                }, 1000);
                
                this.intervals.push(zombie.damageInterval);
            }

            activateMower(row) {
                const mower = this.mowers.find(m => m.row === row);
                if (!mower || mower.active) return;

                mower.active = true;
                let x = -35;
                const interval = setInterval(() => {
                    if (!this.gameRunning) {
                        clearInterval(interval);
                        return;
                    }

                    x += 10;
                    mower.element.style.left = `${x}px`;

                    const objectSize = this.cellWidth * 0.8;
                    const offset = (this.cellWidth - objectSize) / 2;

                    this.zombies.forEach(zombie => {
                        if (zombie.row === row && zombie.alive) {
                            const zombieX = zombie.x + offset;
                            
                            if (x + 40 > zombieX && x < zombieX + objectSize) {
                                this.flashElement(zombie.element, 'flash-white', 300);
                                zombie.hp -= 200;
                                if (zombie.hp <= 0) {
                                    zombie.alive = false;
                                    zombie.element.remove();
                                    if (zombie.damageInterval) {
                                        clearInterval(zombie.damageInterval);
                                    }
                                }
                            }
                        }
                    });

                    if (x > window.innerWidth + 100) {
                        clearInterval(interval);
                        mower.active = false;
                        mower.element.style.left = '-35px';
                    }
                }, 50);
                this.intervals.push(interval);
            }

            shootProjectile(row, col) {
                if (!this.gameRunning) return;

                const projectile = document.createElement('img');
                projectile.src = IMAGES.projectile;
                projectile.className = 'projectile';
                const centerX = col * this.cellWidth + this.cellWidth / 2;
                const centerY = this.cellHeight / 2;
                projectile.style.left = `${centerX}px`;
                projectile.style.top = `${centerY - 14}px`;

                const rowElement = document.querySelector(`.row[data-row="${row}"]`);
                rowElement.appendChild(projectile);

                const projectileObj = {
                    row: row,
                    x: centerX,
                    element: projectile,
                    active: true
                };

                this.projectiles.push(projectileObj);

                const interval = setInterval(() => {
                    if (!projectileObj.active || !this.gameRunning) {
                        clearInterval(interval);
                        return;
                    }

                    projectileObj.x += 8;
                    projectileObj.element.style.left = `${projectileObj.x}px`;

                    const objectSize = this.cellWidth * 0.8;
                    const offset = (this.cellWidth - objectSize) / 2;

                    this.zombies.forEach(zombie => {
                        if (zombie.row === row && zombie.alive) {
                            const zombieX = zombie.x + offset;
                            const zombieRight = zombieX + objectSize;
                            
                            // Снаряд попадает, когда его центр находится внутри хитбокса зомби
                            if (projectileObj.x > zombieX && projectileObj.x < zombieRight) {
                                zombie.hp -= 20;
                                projectileObj.active = false;
                                projectileObj.element.remove();
                                this.audioManager.playSound('hit');
                                
                                this.flashElement(zombie.element, 'flash-white', 300);
                                
                                if (zombie.hp <= 0) {
                                    zombie.alive = false;
                                    zombie.element.remove();
                                    if (zombie.damageInterval) {
                                        clearInterval(zombie.damageInterval);
                                    }
                                }
                            }
                        }
                    });

                    if (projectileObj.x > window.innerWidth + 50) {
                        projectileObj.active = false;
                        projectileObj.element.remove();
                        clearInterval(interval);
                    }
                }, 30);
                this.intervals.push(interval);
            }

            checkPeashooters() {
                const now = Date.now();
                for (let r = 0; r < this.rows; r++) {
                    let hasZombie = this.zombies.some(z => z.row === r && z.alive);
                    if (hasZombie) {
                        for (let c = 0; c < this.cols; c++) {
                            if (this.plants[r][c] && this.plants[r][c].type === 'peashooter') {
                                if (now - this.plants[r][c].lastShot >= 2000) {
                                    this.plants[r][c].lastShot = now;
                                    this.shootProjectile(r, c);
                                }
                            }
                        }
                    }
                }
            }

            checkSunflowers() {
                const now = Date.now();
                for (let r = 0; r < this.rows; r++) {
                    for (let c = 0; c < this.cols; c++) {
                        const plant = this.plants[r][c];
                        if (plant && plant.type === 'sunflower') {
                            if (!plant.firstSunDone) {
                                if (now - plant.lastSun >= plant.firstSunDelay) {
                                    plant.firstSunDone = true;
                                    plant.lastSun = now;
                                    this.spawnSunFromPlant(r, c);
                                }
                            } else {
                                if (now - plant.lastSun >= 24000) {
                                    plant.lastSun = now;
                                    this.spawnSunFromPlant(r, c);
                                }
                            }
                        }
                    }
                }
            }

            startGame() {
                this.gameRunning = true;
                
                const firstZombieDelay = 20000;
                
                const zombieInterval = setInterval(() => {
                    if (this.gameRunning) {
                        if (Date.now() - this.gameStartTime >= firstZombieDelay) {
                            this.spawnZombie();
                            
                            if (this.zombieCounter % 10 === 0) {
                                this.waveNumber++;
                            }
                        }
                    }
                }, 8000);
                this.intervals.push(zombieInterval);

                const firstZombie = setTimeout(() => {
                    if (this.gameRunning) {
                        this.spawnZombie();
                    }
                }, firstZombieDelay);
                this.timeouts.push(firstZombie);

                const sunInterval = setInterval(() => {
                    if (this.gameRunning) {
                        this.spawnSun();
                    }
                }, 5000);
                this.intervals.push(sunInterval);

                const gameLoop = setInterval(() => {
                    if (!this.gameRunning) return;
                    this.checkPeashooters();
                    this.checkSunflowers();
                }, 100);
                this.intervals.push(gameLoop);
            }
        }

        const game = new Game();
    </script>
</body>
