<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Plants vs Zombies - Дневная Лужайка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(180deg, #87CEEB 0%, #98D8E8 50%, #1a3e1f 50%, #2d5a2a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            padding: 20px;
            overflow: hidden;
        }

        .game-container {
            width: 1100px;
            max-width: 98vw;
            background: #5b8c4e;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            position: relative;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #c4a26b;
            padding: 10px 20px;
            border-radius: 15px;
            border: 3px solid #7a5c3a;
            margin-bottom: 15px;
        }

        .sun-counter {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #e9dbbd;
            padding: 5px 20px;
            border-radius: 30px;
            font-size: 28px;
            font-weight: bold;
            color: #3b2a0e;
            border: 3px solid #aa8b55;
        }

        .sun-counter img {
            width: 35px;
            height: 35px;
        }

        .seed-bank {
            display: flex;
            gap: 10px;
        }

        .seed {
            width: 80px;
            height: 80px;
            background: #e7d6b5;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 3px solid #4f3a1e;
            transition: all 0.2s;
            position: relative;
        }

        .seed:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        .seed.selected {
            border: 4px solid #ffeb3b;
            box-shadow: 0 0 20px rgba(255,235,59,0.8);
            transform: translateY(-3px);
        }

        .seed.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(0.8);
        }

        .seed img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .seed .cost {
            font-size: 14px;
            font-weight: bold;
            color: #2b1c09;
            background: #fcf3da;
            padding: 2px 10px;
            border-radius: 10px;
            margin-top: 2px;
        }

        .lawn-container {
            position: relative;
            background: #6da554;
            border-radius: 15px;
            padding: 10px;
            border: 4px solid #3e6b2c;
            overflow: hidden;
        }

        .lawn {
            display: grid;
            grid-template-rows: repeat(5, 1fr);
            gap: 5px;
            position: relative;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 5px;
            position: relative;
            min-height: 95px;
            border-radius: 3px;
        }

        .cell {
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            min-height: 95px;
            transition: all 0.2s;
            background-size: cover;
            background-position: center;
        }

        .cell:hover {
            filter: brightness(1.3);
            transform: scale(1.03);
            z-index: 1;
        }

        .cell.occupied {
            cursor: not-allowed;
            filter: none;
            transform: none;
        }

        .plant {
            width: 70px;
            height: 70px;
            object-fit: contain;
            position: absolute;
            z-index: 5;
            pointer-events: none;
            animation: plantIn 0.4s ease-out;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.3));
        }

        @keyframes plantIn {
            from {
                transform: scale(0) rotate(-180deg);
                opacity: 0;
            }
            to {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .zombie {
            position: absolute;
            width: 65px;
            height: 75px;
            object-fit: contain;
            z-index: 7;
            pointer-events: none;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.4));
            transition: right 0.05s linear;
        }

        .projectile {
            position: absolute;
            width: 30px;
            height: 30px;
            object-fit: contain;
            z-index: 6;
            pointer-events: none;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
        }

        .mower {
            position: absolute;
            width: 75px;
            height: 65px;
            object-fit: contain;
            z-index: 9;
            pointer-events: none;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.4));
            left: -15px;
            bottom: 10px;
            transition: left 0.1s linear;
        }

        .sun {
            position: absolute;
            width: 45px;
            height: 45px;
            z-index: 12;
            cursor: pointer;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.4));
            animation: floatSun 2s infinite ease-in-out;
            pointer-events: auto;
            transition: transform 0.2s;
        }

        .sun:hover {
            transform: scale(1.2);
            animation: none;
        }

        @keyframes floatSun {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #4a3e2c;
            padding: 10px 20px;
            border-radius: 15px;
            border: 3px solid #b48b4c;
            margin-top: 15px;
            color: #fbeab3;
            font-weight: bold;
            font-size: 16px;
        }

        .restart-btn {
            background: #e6b422;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 0 #9e7a1a;
            transition: all 0.2s;
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #9e7a1a;
        }

        .restart-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #9e7a1a;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Верхняя панель -->
        <div class="top-bar">
            <div class="sun-counter">
                <img src="https://cdn-icons-png.flaticon.com/512/2720/2720081.png" alt="Солнце">
                <span id="sunCount">150</span>
            </div>
            <div class="seed-bank">
                <div class="seed" id="seedSunflower" title="Подсолнух - 50 солнца">
                    <img src="https://fortport.ru/photo/55463" alt="Подсолнух">
                    <span class="cost">50</span>
                </div>
                <div class="seed" id="seedPeashooter" title="Горохострел - 100 солнца">
                    <img src="https://fortport.ru/photo/55462" alt="Горохострел">
                    <span class="cost">100</span>
                </div>
            </div>
        </div>

        <!-- Газон -->
        <div class="lawn-container">
            <div class="lawn" id="lawn"></div>
        </div>

        <!-- Нижняя панель -->
        <div class="bottom-bar">
            <span>☀️ Дневная Лужайка - Уровень 1</span>
            <button class="restart-btn" id="restartBtn">🌱 Перезапуск</button>
        </div>
    </div>

    <script>
        const IMAGES = {
            sunflower: 'https://fortport.ru/photo/55463',
            peashooter: 'https://fortport.ru/photo/55462',
            zombie: 'https://fortport.ru/photo/4059',
            projectile: 'https://foni.papik.pro/uploads/posts/2024-09/foni-papik-pro-7vtu-p-kartinki-krug-zelenii-na-prozrachnom-fone-13.png',
            mower: 'https://static.wikia.nocookie.net/plantsvs-zombies/images/1/18/Machine.png/revision/latest/scale-to-width-down/250?cb=20200506143358&path-prefix=ru',
            sun: 'https://cdn-icons-png.flaticon.com/512/2720/2720081.png'
        };

        // Аудио файлы (будут загружены с GitHub)
        const AUDIO = {
            background: 'plants_vs_zombies_04 - Grasswalk.mp3',
            sunPickup: 'plants-vs-zombies-sun-pickup.mp3',
            seedPacket: 'plants-vs-zombies-seed-packet-sound.mp3',
            planting: 'plants-vs-zombies-planting-sound.mp3',
            hit: 'plants-vs-zombies-hit.mp3',
            chomp: 'chomp.mp3',
            chomp2: 'chomp2.mp3'
        };

        class AudioManager {
            constructor() {
                this.sounds = {};
                this.backgroundMusic = null;
                this.initAudio();
            }

            initAudio() {
                // Загружаем все звуки
                for (const [key, file] of Object.entries(AUDIO)) {
                    const audio = new Audio(file);
                    audio.preload = 'auto';
                    this.sounds[key] = audio;
                }

                // Настраиваем фоновую музыку
                this.backgroundMusic = this.sounds.background;
                this.backgroundMusic.loop = true;
                this.backgroundMusic.volume = 0.3;
            }

            playBackground() {
                this.backgroundMusic.play().catch(() => {
                    // Автовоспроизведение может быть заблокировано
                    document.addEventListener('click', () => {
                        this.backgroundMusic.play();
                    }, { once: true });
                });
            }

            playSound(soundKey) {
                const sound = this.sounds[soundKey];
                if (sound) {
                    sound.currentTime = 0;
                    sound.play().catch(() => {});
                }
            }

            playChomp() {
                const sounds = [this.sounds.chomp, this.sounds.chomp2];
                const randomSound = sounds[Math.floor(Math.random() * sounds.length)];
                if (randomSound) {
                    randomSound.currentTime = 0;
                    randomSound.play().catch(() => {});
                }
            }
        }

        class Game {
            constructor() {
                this.sunCount = 150;
                this.selectedPlant = null;
                this.gameRunning = true;
                this.rows = 5;
                this.cols = 9;
                this.plants = [];
                this.zombies = [];
                this.projectiles = [];
                this.mowers = [];
                this.suns = [];
                this.intervals = [];
                this.timeouts = [];
                this.zombieCounter = 0;
                this.waveNumber = 1;
                this.audioManager = new AudioManager();

                this.init();
            }

            init() {
                this.createLawn();
                this.createMowers();
                this.bindEvents();
                this.startGame();
                this.audioManager.playBackground();
            }

            createLawn() {
                const lawn = document.getElementById('lawn');
                lawn.innerHTML = '';

                for (let r = 0; r < this.rows; r++) {
                    this.plants[r] = [];
                    const row = document.createElement('div');
                    row.className = 'row';
                    row.dataset.row = r;

                    for (let c = 0; c < this.cols; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.row = r;
                        cell.dataset.col = c;
                        
                        // Шахматный порядок травы
                        if ((r + c) % 2 === 0) {
                            cell.style.backgroundImage = "url('https://fortport.ru/photo/51017')";
                        } else {
                            cell.style.backgroundImage = "url('https://fortport.ru/photo/51016')";
                        }
                        
                        cell.addEventListener('click', (e) => this.onCellClick(e));
                        row.appendChild(cell);
                        this.plants[r][c] = null;
                    }

                    lawn.appendChild(row);
                }
            }

            createMowers() {
                this.mowers = [];
                const rows = document.querySelectorAll('.row');
                rows.forEach((row, index) => {
                    const mower = document.createElement('img');
                    mower.src = IMAGES.mower;
                    mower.className = 'mower';
                    mower.style.left = '-15px';
                    row.appendChild(mower);
                    this.mowers.push({
                        row: index,
                        element: mower,
                        active: false,
                        x: -15
                    });
                });
            }

            bindEvents() {
                document.getElementById('seedSunflower').addEventListener('click', () => {
                    this.audioManager.playSound('seedPacket');
                    this.togglePlantSelection('sunflower');
                });

                document.getElementById('seedPeashooter').addEventListener('click', () => {
                    this.audioManager.playSound('seedPacket');
                    this.togglePlantSelection('peashooter');
                });

                document.getElementById('restartBtn').addEventListener('click', () => {
                    this.restartGame();
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        this.selectedPlant = null;
                        this.updateSeedButtons();
                    }
                });
            }

            togglePlantSelection(type) {
                if (!this.gameRunning) return;
                
                const cost = type === 'sunflower' ? 50 : 100;
                if (this.sunCount < cost) return;

                if (this.selectedPlant === type) {
                    this.selectedPlant = null;
                } else {
                    this.selectedPlant = type;
                }
                this.updateSeedButtons();
            }

            updateSeedButtons() {
                const sunSeed = document.getElementById('seedSunflower');
                const peaSeed = document.getElementById('seedPeashooter');

                sunSeed.classList.toggle('selected', this.selectedPlant === 'sunflower');
                peaSeed.classList.toggle('selected', this.selectedPlant === 'peashooter');
                sunSeed.classList.toggle('disabled', this.sunCount < 50);
                peaSeed.classList.toggle('disabled', this.sunCount < 100);
            }

            onCellClick(e) {
                if (!this.gameRunning || !this.selectedPlant) return;

                const row = parseInt(e.target.dataset.row);
                const col = parseInt(e.target.dataset.col);

                if (this.plants[row][col]) return;

                const cost = this.selectedPlant === 'sunflower' ? 50 : 100;
                if (this.sunCount < cost) return;

                this.sunCount -= cost;
                this.updateSunDisplay();
                this.audioManager.playSound('planting');
                this.plantOnCell(row, col, this.selectedPlant);
                this.selectedPlant = null;
                this.updateSeedButtons();
            }

            plantOnCell(row, col, type) {
                const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
                const plant = document.createElement('img');
                plant.src = type === 'sunflower' ? IMAGES.sunflower : IMAGES.peashooter;
                plant.className = 'plant';
                cell.appendChild(plant);
                cell.classList.add('occupied');
                
                const plantData = {
                    type: type,
                    element: plant,
                    lastShot: 0,
                    lastSun: Date.now()
                };
                
                this.plants[row][col] = plantData;
            }

            updateSunDisplay() {
                document.getElementById('sunCount').textContent = this.sunCount;
                this.updateSeedButtons();
            }

            spawnSun() {
                if (!this.gameRunning) return;

                const row = Math.floor(Math.random() * this.rows);
                const col = Math.floor(Math.random() * (this.cols - 1));
                const sun = document.createElement('img');
                sun.src = IMAGES.sun;
                sun.className = 'sun';
                sun.style.left = `${col * 110 + 40}px`;
                sun.style.top = '-50px';
                
                const rowElement = document.querySelector(`.row[data-row="${row}"]`);
                rowElement.appendChild(sun);
                this.suns.push(sun);

                let y = -50;
                const fallInterval = setInterval(() => {
                    if (!this.gameRunning) {
                        clearInterval(fallInterval);
                        return;
                    }
                    y += 3;
                    sun.style.top = `${y}px`;
                    
                    if (y >= 80) {
                        clearInterval(fallInterval);
                        sun.style.cursor = 'pointer';
                        sun.addEventListener('click', () => this.collectSun(sun));
                        
                        setTimeout(() => {
                            if (sun.parentNode) {
                                this.collectSun(sun);
                            }
                        }, 8000);
                    }
                }, 30);
                this.intervals.push(fallInterval);
            }

            spawnSunFromPlant(row, col) {
                if (!this.gameRunning) return;

                const sun = document.createElement('img');
                sun.src = IMAGES.sun;
                sun.className = 'sun';
                sun.style.left = `${col * 110 + 50}px`;
                sun.style.top = `${row * 105 + 30}px`;
                
                const rowElement = document.querySelector(`.row[data-row="${row}"]`);
                rowElement.appendChild(sun);
                this.suns.push(sun);
                
                sun.style.cursor = 'pointer';
                sun.addEventListener('click', () => this.collectSun(sun));
                
                setTimeout(() => {
                    if (sun.parentNode) {
                        this.collectSun(sun);
                    }
                }, 10000);
            }

            collectSun(sunElement) {
                if (!this.gameRunning || !sunElement.parentNode) return;

                this.sunCount += 25;
                this.updateSunDisplay();
                this.audioManager.playSound('sunPickup');
                sunElement.remove();
                
                const index = this.suns.indexOf(sunElement);
                if (index > -1) {
                    this.suns.splice(index, 1);
                }
            }

            spawnZombie() {
                if (!this.gameRunning) return;

                this.zombieCounter++;
                const row = Math.floor(Math.random() * this.rows);
                const zombie = document.createElement('img');
                zombie.src = IMAGES.zombie;
                zombie.className = 'zombie';
                zombie.style.right = '-70px';
                zombie.style.top = '15px';

                const rowElement = document.querySelector(`.row[data-row="${row}"]`);
                rowElement.appendChild(zombie);

                const zombieObj = {
                    id: Date.now() + Math.random(),
                    row: row,
                    x: 0,
                    hp: 200,
                    element: zombie,
                    alive: true,
                    speed: 0.4,
                    eating: false,
                    damageInterval: null
                };

                this.zombies.push(zombieObj);
                this.moveZombie(zombieObj);
            }

            moveZombie(zombie) {
                if (!zombie.alive || !this.gameRunning) return;

                const interval = setInterval(() => {
                    if (!zombie.alive || !this.gameRunning) {
                        clearInterval(interval);
                        return;
                    }

                    let hasPlant = false;
                    for (let c = 0; c < this.cols; c++) {
                        if (this.plants[zombie.row][c]) {
                            const plantX = c * 110;
                            const zombieX = zombie.x + 70;
                            
                            if (zombie.x < plantX + 80 && zombieX > plantX) {
                                hasPlant = true;
                                if (!zombie.eating) {
                                    zombie.eating = true;
                                    this.startEating(zombie, c);
                                }
                                break;
                            }
                        }
                    }

                    if (!hasPlant) {
                        if (zombie.eating) {
                            zombie.eating = false;
                            if (zombie.damageInterval) {
                                clearInterval(zombie.damageInterval);
                            }
                        }
                        zombie.x += zombie.speed;
                        zombie.element.style.right = `${zombie.x}px`;
                    }

                    if (zombie.x > 900) {
                        this.activateMower(zombie.row);
                        zombie.alive = false;
                        zombie.element.remove();
                        const index = this.zombies.indexOf(zombie);
                        if (index > -1) {
                            this.zombies.splice(index, 1);
                        }
                        clearInterval(interval);
                    }
                }, 100);
                this.intervals.push(interval);
            }

            startEating(zombie, plantCol) {
                if (zombie.damageInterval) {
                    clearInterval(zombie.damageInterval);
                }
                
                zombie.damageInterval = setInterval(() => {
                    if (!zombie.alive || !this.gameRunning) {
                        clearInterval(zombie.damageInterval);
                        return;
                    }
                    
                    if (this.plants[zombie.row][plantCol]) {
                        const plant = this.plants[zombie.row][plantCol];
                        this.audioManager.playChomp();
                        plant.element.remove();
                        this.plants[zombie.row][plantCol] = null;
                        document.querySelector(`.cell[data-row="${zombie.row}"][data-col="${plantCol}"]`).classList.remove('occupied');
                        zombie.eating = false;
                        clearInterval(zombie.damageInterval);
                    }
                }, 1000);
                
                this.intervals.push(zombie.damageInterval);
            }

            activateMower(row) {
                const mower = this.mowers.find(m => m.row === row);
                if (!mower || mower.active) return;

                mower.active = true;
                let x = -15;
                const interval = setInterval(() => {
                    if (!this.gameRunning) {
                        clearInterval(interval);
                        return;
                    }

                    x += 10;
                    mower.element.style.left = `${x}px`;

                    this.zombies.forEach(zombie => {
                        if (zombie.row === row && zombie.alive) {
                            const zombieX = zombie.x;
                            if (x > zombieX - 30 && x < zombieX + 30) {
                                zombie.alive = false;
                                zombie.element.remove();
                                if (zombie.damageInterval) {
                                    clearInterval(zombie.damageInterval);
                                }
                            }
                        }
                    });

                    if (x > 950) {
                        clearInterval(interval);
                        mower.active = false;
                        mower.element.style.left = '-15px';
                    }
                }, 50);
                this.intervals.push(interval);
            }

            shootProjectile(row, col) {
                if (!this.gameRunning) return;

                const projectile = document.createElement('img');
                projectile.src = IMAGES.projectile;
                projectile.className = 'projectile';
                projectile.style.left = `${col * 110 + 60}px`;
                projectile.style.top = '30px';

                const rowElement = document.querySelector(`.row[data-row="${row}"]`);
                rowElement.appendChild(projectile);

                const projectileObj = {
                    row: row,
                    x: col * 110 + 60,
                    element: projectile,
                    active: true
                };

                this.projectiles.push(projectileObj);

                const interval = setInterval(() => {
                    if (!projectileObj.active || !this.gameRunning) {
                        clearInterval(interval);
                        return;
                    }

                    projectileObj.x += 15;
                    projectileObj.element.style.left = `${projectileObj.x}px`;

                    this.zombies.forEach(zombie => {
                        if (zombie.row === row && zombie.alive) {
                            const zombieLeft = zombie.x;
                            const zombieRight = zombie.x + 65;
                            
                            if (projectileObj.x >= zombieLeft && projectileObj.x <= zombieRight) {
                                zombie.hp -= 20;
                                projectileObj.active = false;
                                projectileObj.element.remove();
                                this.audioManager.playSound('hit');
                                
                                if (zombie.hp <= 0) {
                                    zombie.alive = false;
                                    zombie.element.remove();
                                    if (zombie.damageInterval) {
                                        clearInterval(zombie.damageInterval);
                                    }
                                }
                            }
                        }
                    });

                    if (projectileObj.x > 950) {
                        projectileObj.active = false;
                        projectileObj.element.remove();
                        clearInterval(interval);
                    }
                }, 30);
                this.intervals.push(interval);
            }

            checkPeashooters() {
                const now = Date.now();
                for (let r = 0; r < this.rows; r++) {
                    let hasZombie = this.zombies.some(z => z.row === r && z.alive);
                    if (hasZombie) {
                        for (let c = 0; c < this.cols; c++) {
                            if (this.plants[r][c] && this.plants[r][c].type === 'peashooter') {
                                if (now - this.plants[r][c].lastShot >= 1500) {
                                    this.plants[r][c].lastShot = now;
                                    this.shootProjectile(r, c);
                                }
                            }
                        }
                    }
                }
            }

            checkSunflowers() {
                const now = Date.now();
                for (let r = 0; r < this.rows; r++) {
                    for (let c = 0; c < this.cols; c++) {
                        if (this.plants[r][c] && this.plants[r][c].type === 'sunflower') {
                            if (now - this.plants[r][c].lastSun >= 24000) {
                                this.plants[r][c].lastSun = now;
                                this.spawnSunFromPlant(r, c);
                            }
                        }
                    }
                }
            }

            startGame() {
                this.gameRunning = true;
                
                const zombieInterval = setInterval(() => {
                    if (this.gameRunning) {
                        this.spawnZombie();
                        
                        if (this.zombieCounter % 10 === 0) {
                            this.waveNumber++;
                        }
                    }
                }, 3000);
                this.intervals.push(zombieInterval);

                const sunInterval = setInterval(() => {
                    if (this.gameRunning) {
                        this.spawnSun();
                    }
                }, 5000);
                this.intervals.push(sunInterval);

                const gameLoop = setInterval(() => {
                    if (!this.gameRunning) return;
                    this.checkPeashooters();
                    this.checkSunflowers();
                }, 100);
                this.intervals.push(gameLoop);

                const firstZombie = setTimeout(() => {
                    if (this.gameRunning) {
                        this.spawnZombie();
                    }
                }, 5000);
                this.timeouts.push(firstZombie);
            }

            restartGame() {
                this.gameRunning = false;
                
                this.intervals.forEach(interval => clearInterval(interval));
                this.timeouts.forEach(timeout => clearTimeout(timeout));
                this.intervals = [];
                this.timeouts = [];

                this.zombies.forEach(zombie => {
                    if (zombie.damageInterval) clearInterval(zombie.damageInterval);
                    zombie.element.remove();
                });
                this.projectiles.forEach(projectile => projectile.element.remove());
                this.suns.forEach(sun => sun.remove());
                
                this.zombies = [];
                this.projectiles = [];
                this.suns = [];
                this.plants = [];
                this.sunCount = 150;
                this.selectedPlant = null;
                this.zombieCounter = 0;
                this.waveNumber = 1;

                this.createLawn();
                this.createMowers();
                this.updateSunDisplay();
                this.startGame();
            }
        }

        const game = new Game();
    </script>
</body>
